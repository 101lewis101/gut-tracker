// ─── PAYNOW SGQR BUILDER ──────────────────────────────────────────────────────
function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc;
}

function buildPayNowQR(mobile, amount) {
  const f = (id, val) => `${id}${String(val.length).padStart(2,'0')}${val}`;
  const mai = f('00','SG.PAYNOW') + f('01','0') + f('02', mobile) + f('03','0');
  const body = [
    f('00','01'),
    f('01','12'),
    f('26', mai),
    f('52','0000'),
    f('53','702'),
    f('54', amount.toFixed(2)),
    f('58','SG'),
    f('59','Mr Onigiri'),
    f('60','Singapore'),
    '6304',
  ].join('');
  const checksum = crc16(body).toString(16).toUpperCase().padStart(4,'0');
  return body.slice(0,-4) + '6304' + checksum;
}

  return (

      onError={() => setErr(true)}
      style={{ width:'100%', height:'100%', objectFit:'cover', display:'block', ...style }}

  );

// ─── BOTTOM SHEET ─────────────────────────────────────────────────────────────
function BottomSheet({ open, onClose, children }) {
  useEffect(() => {
    if (!open) return;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
    };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div
      className="fade-in"
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
      style={{
        position:'fixed', inset:0, zIndex:200,
        background:'rgba(26,22,18,0.5)',
        display:'flex', alignItems:'flex-end',

    >

  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [tab,          setTab         ] = useState('allDaySaver');
  const [cart,         setCart        ] = useState({});
  const [sheet,        setSheet       ] = useState(null);   // 'ads'|'item'|'cart'|'checkout'|'paynow'
  const [activeItem,   setActiveItem  ] = useState(null);
  const [pendingOrder, setPendingOrder] = useState(null);   // { name, phone }
  const [ordered,      setOrdered     ] = useState(false);

  // ── Cart operations ──────────────────────────────────────
  const addToCart = useCallback((item) => {
    setCart(prev => {
      const existing = prev[item.key];
      return {
        ...prev,
        [item.key]: existing
          ? { ...existing, qty: existing.qty + item.qty }
          : { ...item },
      };
    });
  }, []);

  const quickAdd = useCallback((item) => {
    setCart(prev => {
      const existing = prev[item.id];
      return {
        ...prev,
        [item.id]: existing
          ? { ...existing, qty: existing.qty + 1 }
          : { key:item.id, name:item.name, price:item.price, qty:1 },
      };
    });
  }, []);

  const quickRemove = useCallback((id) => {
    setCart(prev => {
      const existing = prev[id];
      if (!existing) return prev;
      if (existing.qty <= 1) { const { [id]:_, ...rest } = prev; return rest; }
      return { ...prev, [id]: { ...existing, qty: existing.qty - 1 } };
    });
  }, []);

  const updateQty = useCallback((key, qty) => {
    setCart(prev => ({ ...prev, [key]: { ...prev[key], qty } }));
  }, []);

  const removeFromCart = useCallback((key) => {
    setCart(prev => { const { [key]:_, ...rest } = prev; return rest; });
  }, []);

  const totalItems = Object.values(cart).reduce((s, i) => s + i.qty, 0);
  const subtotal   = Object.values(cart).reduce((s, i) => s + i.price * i.qty, 0);

  // ── WhatsApp message builder ──────────────────────────────
  // Step 1: checkout form submitted → store details and show QR
  const handleCheckoutSubmit = ({ name, phone }) => {
    setPendingOrder({ name, phone });
    setSheet('paynow');
  };

  // Step 2: user taps "I've paid" on QR screen → send WhatsApp and mark ordered
  const handleSendWhatsApp = () => {
    if (!pendingOrder) return;
    const { name, phone } = pendingOrder;
    const items = Object.values(cart);
    const lines = items.map(item => {
      let line = `• ${item.qty}× ${item.name}`;
      if (item.drink || item.side) line += ` (${[item.drink, item.side].filter(Boolean).join(' + ')})`;
      line += ` — ${fmt(item.price * item.qty)}`;
      return line;
    });
    const msg = [
      `🍱 *New Order — Mr Onigiri @ Funan*`,
      '',
      name  ? `👤 Name: ${name}`  : null,
      `📱 Phone: ${phone}`,
      '',
      `*Order:*`,
      ...lines,
      '',
      `💰 *Total: ${fmt(subtotal)}*`,
      '',
      `💚 Payment: PayNow to 90705241`,
      `📸 PayNow screenshot sent separately!`,
    ].filter(l => l !== null).join('\n');

    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    setOrdered(true);
    setSheet(null);
    setPendingOrder(null);

            <div style={{ fontSize:11, color:'#7A6D5E' }}>Self-Collect · Funan Mall</div>
          </div>

            }}
          >
            <div style={{ background:'#C4622D', color:'white', width:26, height:26, borderRadius:999, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:800 }}>{totalItems}</div>
            <span>View Cart</span>
            <span style={{ fontWeight:800 }}>{fmt(subtotal)}</span>
          </button>
        </div>
      )}

      {/* ── Sheets ──────────────────────────────────────── */}
      <BottomSheet open={sheet==='ads'} onClose={() => setSheet(null)}>
        <AllDaySaverSheet
          onAdd={(item) => { addToCart(item); setSheet(null); }}
          onClose={() => setSheet(null)}
        />
      </BottomSheet>

      <BottomSheet open={sheet==='item'} onClose={() => { setSheet(null); setActiveItem(null); }}>
        <ItemSheet
          item={activeItem}
          onAdd={(item) => addToCart(item)}
          onClose={() => { setSheet(null); setActiveItem(null); }}
        />
      </BottomSheet>

      <BottomSheet open={sheet==='cart'} onClose={() => setSheet(null)}>
        <CartSheet
          cart={cart}
          onClose={() => setSheet(null)}
          onCheckout={() => setSheet('checkout')}
          onUpdateQty={updateQty}
          onRemove={removeFromCart}
        />
      </BottomSheet>

      <BottomSheet open={sheet==='checkout'} onClose={() => setSheet('cart')}>
        <CheckoutSheet
          cart={cart}
          onConfirm={handleCheckoutSubmit}
        />
      </BottomSheet>

      <BottomSheet open={sheet==='paynow'} onClose={() => setSheet('checkout')}>
        <PayNowQRSheet
          amount={subtotal}
          onSendWhatsApp={handleSendWhatsApp}
        />
      </BottomSheet>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
